# PrintDock mit Docker Compose – NAS (Synology, QNAP, Unraid, TrueNAS), Raspberry Pi, Server
#
#   docker compose up -d                          nur PrintDock
#   docker compose --profile tailscale up -d      + Zugriff von unterwegs über Tailscale (VPN)
#   docker compose --profile cloudflare up -d     + Zugriff über eigene Adresse (Cloudflare Tunnel)
#
# Werte wie TS_AUTHKEY oder CF_TUNNEL_TOKEN in eine Datei ".env" neben dieser Datei schreiben
# (Vorlage: .env.example). Anleitung: docs/remote-access.md

services:
  printdock:
    image: ghcr.io/codegulasch/printdock:latest
    # Selbst bauen statt fertiges Image laden: nächste Zeile einkommentieren
    # build: .
    container_name: printdock
    restart: unless-stopped
    # Host-Netzwerk, damit PrintDock alle Drucker im Heimnetz direkt erreicht
    # (Bambu-MQTT, Kamera-Streams, Moonraker). Port: 3080
    network_mode: host
    environment:
      - PORT=${PORT:-3080}
      - TZ=${TZ:-Europe/Berlin}
      - PRINTDOCK_LANG=${PRINTDOCK_LANG:-de}
    volumes:
      - ./data:/data

  # ------------------------------------------------------------ Fernzugriff (optional)

  # Tailscale: privates VPN – PrintDock ist nur für deine eigenen Geräte erreichbar.
  # Danach im Tailnet unter http://printdock:3080 (bzw. Hostname des Geräts).
  tailscale:
    image: tailscale/tailscale:latest
    profiles: [tailscale]
    container_name: printdock-tailscale
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?TS_AUTHKEY in .env eintragen}
      - TS_HOSTNAME=${TS_HOSTNAME:-printdock}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./tailscale:/var/lib/tailscale

  # Cloudflare Tunnel: eigene Adresse mit HTTPS (z. B. https://drucker.example.com),
  # ohne Portfreigabe am Router. Im Cloudflare-Dashboard als Ziel http://localhost:3080 eintragen.
  # WICHTIG: In PrintDock unter Einstellungen → Allgemein den Login-Schutz einschalten.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    container_name: printdock-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN in .env eintragen}
