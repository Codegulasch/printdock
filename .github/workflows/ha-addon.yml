# Home-Assistant-Add-on: ghcr.io/<owner>/printdock-addon-{arch}:<version>
# Die Version kommt aus ha-addon/config.yaml (wird von "npm run ha-addon" aus package.json übernommen).
name: Home Assistant add-on

on:
  push:
    branches: [main]
    paths:
      - 'ha-addon/**'
      - 'server.js'
      - 'camera.js'
      - 'notify.js'
      - 'lib/**'
      - 'drivers/**'
      - 'public/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  addon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App in den Add-on-Ordner kopieren
        run: node scripts/build-ha-addon.js
      - id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - id: owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ha-addon
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/printdock-addon-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/printdock-addon-${{ matrix.arch }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=addon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}
