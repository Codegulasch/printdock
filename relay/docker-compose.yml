# PrintDock Status-Server auf eurem Server
#   RELAY_KEYS in .env eintragen (z. B. RELAY_KEYS=werkstatt:langer-zufaelliger-schluessel)
#   docker compose up -d --build
# Davor gehört ein Reverse-Proxy mit HTTPS (Caddy, nginx, Traefik) – siehe README.md
services:
  printdock-relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    container_name: printdock-relay
    restart: unless-stopped
    environment:
      - RELAY_KEYS=${RELAY_KEYS:?RELAY_KEYS in .env eintragen}
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
