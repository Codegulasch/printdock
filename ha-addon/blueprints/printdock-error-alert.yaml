blueprint:
  name: "PrintDock: Störung – Alarm im Haus"
  description: >
    Reagiert, wenn ein Drucker eine Störung meldet oder pausiert (z. B. Filament leer): Licht rot blinken lassen,
    Sprachausgabe oder Meldung – die Aktionen wählst du selbst.
  domain: automation
  source_url: https://github.com/Codegulasch/printdock/blob/main/blueprints/printdock-error-alert.yaml
  input:
    status_sensor:
      name: Status
      description: sensor „… Status“ des Druckers
      selector:
        entity:
          filter: [{ domain: sensor, integration: mqtt }]
    actions:
      name: Aktionen
      selector:
        action: {}
mode: single
trigger:
  - platform: state
    entity_id: !input status_sensor
    to: ["Störung", "Pausiert", "Fault", "Error", "Paused"]
action: !input actions
