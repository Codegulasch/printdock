name: PrintDock
version: "0.24.1"
slug: printdock
description: "Public beta – manage and monitor all your 3D printers: Bambu Lab, Snapmaker, Anycubic, Klipper, OctoPrint"
url: https://github.com/Codegulasch/printdock
# Fertiges Image aus der GitHub-Action (ghcr.io). Zeile entfernen, um das Add-on lokal zu bauen
# (dann vorher "npm run ha-addon" ausführen und ha-addon/app einchecken).
image: ghcr.io/codegulasch/printdock-addon-{arch}
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 3080
panel_icon: mdi:printer-3d
panel_title: PrintDock
homeassistant_api: true
# Supervisor-Zugriff: Neustart nach dem Einspielen einer Sicherung, Update aus PrintDock heraus
hassio_api: true
hassio_role: manager
# Für die Dashboard-Karte: PrintDock legt sie unter /config/www/printdock ab und trägt sie als Ressource ein
map:
  - type: homeassistant_config
    read_only: false
  # Update aus PrintDock heraus (lokales Add-on): neue Version in den eigenen Add-on-Ordner schreiben
  - type: addons
    read_only: false
  # Eingangsordner /share/printdock: Exporte aus Bambu Studio (Samba-Freigabe „share“) werden übernommen
  - type: share
    read_only: false
  # Speicherort auf dem NAS: Netzwerkspeicher aus Home Assistant (Einstellungen → System → Speicher)
  # erscheinen als /share/<Name> (Verwendung „Freigabe“) bzw. /media/<Name> (Verwendung „Medien“)
  - type: media
    read_only: false
services:
  - mqtt:want
ports:
  3080/tcp: 3080
ports_description:
  3080/tcp: Direct access for slicer uploads, phone and camera images
backup_exclude:
  - "*.tmp"
  # Zwischenspeicher für vom NAS geholte Dateien
  - "tmp/*"
  - "before-restore-*"
  - "restore-*"
  - "bin"
options: {}
schema: {}
