name: PrintDock
version: "0.7.2"
slug: printdock
description: Manage and monitor all your 3D printers – Bambu Lab, Snapmaker, Anycubic, Klipper, OctoPrint
url: https://github.com/Codegulasch/printdock
# Fertiges Image aus der GitHub-Action (ghcr.io). Zeile entfernen, um das Add-on lokal zu bauen
# (dann vorher "npm run ha-addon" ausführen und ha-addon/app einchecken).
image: ghcr.io/codegulasch/printdock-addon-{arch}
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 3080
panel_icon: mdi:printer-3d
panel_title: PrintDock
homeassistant_api: true
# Für die Dashboard-Karte: PrintDock legt sie unter /config/www/printdock ab und trägt sie als Ressource ein
map:
  - type: homeassistant_config
    read_only: false
services:
  - mqtt:want
ports:
  3080/tcp: 3080
ports_description:
  3080/tcp: Direct access for slicer uploads, phone and camera images
backup_exclude:
  - "*.tmp"
options: {}
schema: {}
