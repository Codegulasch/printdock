blueprint:
  name: "PrintDock: Abluft während des Drucks"
  description: >
    Schaltet einen Lüfter, eine Abluft oder einen Luftreiniger ein, solange ein Drucker druckt,
    und mit Nachlaufzeit wieder aus – z. B. für ASA/ABS.
  domain: automation
  source_url: https://github.com/Codegulasch/printdock/blob/main/blueprints/printdock-fan-printing.yaml
  input:
    printing_sensor:
      name: Druckt
      description: binary_sensor „… Druckt“ des Druckers
      selector:
        entity:
          filter: [{ domain: binary_sensor, integration: mqtt }]
    fan:
      name: Lüfter / Abluft
      selector:
        target:
          entity: [{ domain: [fan, switch, light] }]
    afterrun:
      name: Nachlauf
      default: 10
      selector:
        number: { min: 0, max: 120, unit_of_measurement: min }
mode: restart
trigger:
  - platform: state
    entity_id: !input printing_sensor
action:
  - if:
      - condition: template
        value_template: "{{ trigger.to_state.state == 'on' }}"
    then:
      - service: homeassistant.turn_on
        target: !input fan
    else:
      - delay:
          minutes: !input afterrun
      - service: homeassistant.turn_off
        target: !input fan
